specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: National Council on Disability
providerId: national-council-on-disability
created: '2026-05-04'
modified: '2026-09-14'
generated: '2026-09-14'
method: searched
source: https://www.ncd.gov/
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. That scaffold asserted
  X-RateLimit-* response headers, 429/503 status codes and five per-tier limits (10/100/1000 rpm,
  1,000 and 100,000 monthly quotas). NCD publishes none of that and serves no API. Replaced here
  by the measured result. See roadmap#35.
tags:
  - Disability
  - Federal Government
  - Policy
  - Rate Limiting
description: >-
  Published rate limits for the National Council on Disability. NCD operates no API, so there
  is no documented limit, no quota, and no rate-limit signalling to record. The only traffic
  controls observable are the edge defaults of the hosting stack.
limit_count: 0
limits: []
headers: {}
responseCodes: {}
observed:
  - host: www.ncd.gov
    method: probed
    date: '2026-09-14'
    finding: >-
      Static site on Cloud.gov Pages fronted by Amazon CloudFront (x-server: Cloud.gov Pages,
      via: CloudFront, x-cache: Hit from cloudfront). Responses carry cache-control: max-age=60,
      strict-transport-security, x-frame-options and x-content-type-options; no RateLimit-*,
      X-RateLimit-* or Retry-After header was returned on any 2xx or 4xx response.
    headers_returned:
      - cache-control
      - strict-transport-security
      - x-frame-options
      - x-content-type-options
      - x-robots-tag
      - etag
      - via
      - x-cache
  - host: www.ncd.gov
    path: /robots.txt
    status: 200
    finding: >-
      robots.txt declares only a Sitemap line — no Crawl-delay, no Disallow, no AI/agent-specific
      user-agent rules. Crawling and agent access are unrestricted by policy.
note: >-
  Absence of published limits is not absence of limits: CloudFront applies its own origin and
  request protections that NCD does not document. An honest zero, recorded rather than guessed.
maintainers:
