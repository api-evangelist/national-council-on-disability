supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. That scaffold asserted
  Free / Professional / Enterprise tiers with 1,000 and 100,000 request quotas and per-minute
  rate limits. None of it was published by NCD, and NCD has no API to meter. It is replaced
  here by the measured result. See roadmap#35.
