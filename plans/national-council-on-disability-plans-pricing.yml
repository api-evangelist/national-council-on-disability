description: >-
  Plans and pricing for the National Council on Disability. NCD is an independent US federal
  agency funded by congressional appropriation. It sells nothing, meters nothing, and operates
  no API, so there are no plans, tiers, quotas or prices to record. Every NCD publication —
  policy reports, congressional testimony, FOIA e-Library documents, budget justifications and
  financial audits — is downloadable at no cost with no account and no key.
