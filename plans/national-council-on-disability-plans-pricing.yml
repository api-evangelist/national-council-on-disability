evidence:
  - url: https://www.ncd.gov/
    status: 200
    finding: No pricing, plans, subscription or developer-tier surface anywhere in the site navigation or footer.
  - url: https://www.ncd.gov/foia/
    status: 200
    finding: FOIA e-Library documents are free to download; FOIA fee schedules apply only to custom FOIA requests, not to published material.
  - url: https://www.ncd.gov/accountability/congressional-budget-justification-reports/
    status: 200
    finding: Agency funding is appropriated, not earned — the budget justifications are the closest thing NCD has to a pricing document.
