description: >-
  Probe of the RFC 8615 /.well-known/ namespace on every host in this record. NCD runs a
  single static Jekyll site on Cloud.gov Pages behind CloudFront; there is no API host and
  no separate docs/console host, so the registrable domain and its www alias are the complete
  host set. Every named path returned 404 with an HTML body (the site's standard 404 page),
  so no WellKnown or SecurityTxt pointer is emitted. The 404s are genuine — the site returns
  a real 404 status, not a soft-200 catch-all.
note: >-
  The absence of /.well-known/security.txt is notable for a US federal executive-branch
  agency: CISA Binding Operational Directive 20-01 directs agencies to publish a
  vulnerability disclosure policy at /vulnerability-disclosure-policy and a security.txt.
  NCD publishes the policy (see security/national-council-on-disability-vulnerability-disclosure.yml)
  but at /accountability/vulnerability-disclosure-policy/ and with no security.txt companion.
